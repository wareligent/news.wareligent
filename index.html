<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wareligent | Global Digital Portal</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #f8f9fa;
            --border: #e5e7eb;
            --text-dark: #111827;
            --text-muted: #6b7280;
            --brand-orange: #f97316;
            --brand-orange-hover: #ea580c;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-body); color: var(--text-dark); font-family: 'Inter', sans-serif; }

        /* Fully Responsive Top Navigation Header */
        header {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap; /* মোবাইলে আইটেম ওভারল্যাপ ভাঙবে */
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { 
            font-size: 1.25rem; 
            font-weight: 800; 
            color: var(--text-dark); 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        .logo i { color: var(--brand-orange); }

        .auth-nav {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap; /* ছোট স্ক্রিনে ভেঙ্গে নিচে যাবে, ওভারল্যাপ করবে না */
        }

        .nav-link {
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .btn-write {
            background: var(--brand-orange);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .btn-login {
            background: var(--text-dark);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .btn-logout {
            background: none;
            border: none;
            color: var(--danger);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
        }

        .user-greeting {
            font-size: 0.8rem;
            color: var(--text-muted);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Container Layout */
        .container { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
        .section-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; border-bottom: 2px solid var(--text-dark); padding-bottom: 8px; }

        /* News Grid System */
        #news-feed {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .news-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .news-card:hover { transform: translateY(-3px); }
        .news-card img { width: 100%; height: 180px; object-fit: cover; background: #eee; }
        .news-card-content { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
        .news-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; line-height: 1.4; color: var(--text-dark); }
        .news-card p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 12px; flex-grow: 1; }
        .news-meta { font-size: 0.75rem; color: #9ca3af; font-weight: 500; }
    </style>
</head>
<body>

    <!-- Responsive Top Navigation Header -->
    <header>
        <a href="index.html" class="logo"><i class="fa-solid fa-cube"></i> Wareligent</a>
        
        <div id="authNav" class="auth-nav">
            <!-- Dynamic authentication state will load here -->
        </div>
    </header>

    <div class="container">
        <div class="section-title">Latest Articles</div>
        <div id="news-feed">
            <p style="color:var(--text-muted);">Loading articles...</p>
        </div>
    </div>

    <!-- Supabase Client Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://xveccsbdrysuiwyuvodw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_HkyRE170ylT0kkdZxbwUSQ_ihHrS_Ra';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Header Navigation Control
        async function updateHeaderAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authNav = document.getElementById('authNav');

            if (session) {
                const name = session.user.user_metadata.full_name || session.user.email;
                authNav.innerHTML = `
                    <a href="publish.html" class="btn-write">+ Write</a>
                    <a href="profile.html" class="nav-link">Profile</a>
                    <span class="user-greeting">Hi, <strong>${name}</strong></span>
                    <button onclick="handleLogout()" class="btn-logout">Logout</button>
                `;
            } else {
                authNav.innerHTML = `
                    <a href="login.html" class="btn-login">Login / Sign Up</a>
                `;
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        // Fetch Articles and Render to UI
        async function loadArticles() {
            const feedContainer = document.getElementById('news-feed');

            // .neq('status', 'held') যুক্ত করে হোল্ডে থাকা আর্টিকেলে ফিল্টার বসানো হয়েছে
            const { data: articles, error } = await supabaseClient
                .from('articles')
                .select('*')
                .neq('status', 'held')
                .order('created_at', { ascending: false });

            if (error) {
                feedContainer.innerHTML = `<p style="color:red;">Error loading articles: ${error.message}</p>`;
                return;
            }

            if (!articles || articles.length === 0) {
                feedContainer.innerHTML = '<p style="color:var(--text-muted);">No articles found yet. Write the first one!</p>';
                return;
            }

            feedContainer.innerHTML = articles.map(item => {
                const firstImage = item.image_url ? item.image_url.split(',')[0] : 'https://via.placeholder.com/400x200?text=No+Image';
                const snippet = item.content ? item.content.substring(0, 100) + '...' : '';
                const date = new Date(item.created_at).toLocaleDateString();

                return `
                    <a href="article.html?id=${item.id}" class="news-card">
                        <img src="${firstImage}" alt="${item.title || 'Article'}">
                        <div class="news-card-content">
                            <h3>${item.title || 'Untitled Article'}</h3>
                            <p>${snippet}</p>
                            <div class="news-meta">
                                By ${item.author || 'Wareligent'} • ${date}
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        // Execute Functions
        updateHeaderAuth();
        loadArticles();
    </script>
</body>
</html>
