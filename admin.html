<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel | Wareligent News</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #030712; --card: rgba(17, 24, 39, 0.8); --border: rgba(255,255,255,0.08); --red: #ef4444; --green: #22c55e; --purple: #a855f7; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .admin-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 25px; }
        h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--purple); }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); }
        .badge-hold { background: rgba(239, 68, 68, 0.2); color: var(--red); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .btn-group { display: flex; gap: 8px; }
        .btn-act { padding: 6px 12px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        .btn-approve { background: var(--green); color: #fff; }
        .btn-delete { background: var(--red); color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fa-solid fa-shield-halved"></i> Admin Control Center</h1>
        <p style="color: #9ca3af; margin-bottom: 25px;">মডারেশন, কন্টেন্ট ফিল্টারিং এবং পেমেন্ট অনুমোদন প্যানেল।</p>

        <!-- Auto-Hold Reported Posts Section -->
        <div class="admin-box">
            <h2><i class="fa-solid fa-flag"></i> Reported & Hold Articles (অটো-হোল্ড হওয়া পোস্ট)</h2>
            <div class="list-item">
                <div>
                    <strong>ভুয়া সংবাদের অভিযোগ পাওয়া পোস্ট Title...</strong>
                    <div style="font-size:0.8rem; color:#9ca3af; margin-top:4px;">
                        Report Count: <span class="badge-hold">6 Reports</span> • Posted by: User102
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn-act btn-approve" onclick="alert('পোস্ট রিলিজ করা হয়েছে!')">Un-hold</button>
                    <button class="btn-act btn-delete" onclick="alert('পোস্ট ডিলিট করা হয়েছে!')">Delete</button>
                </div>
            </div>
        </div>

        <!-- Pending Payout Requests -->
        <div class="admin-box">
            <h2><i class="fa-solid fa-hand-holding-dollar"></i> Pending Withdrawal Requests</h2>
            <div class="list-item">
                <div>
                    <strong>User: Baijid ($12.45)</strong>
                    <div style="font-size:0.8rem; color:#9ca3af; margin-top:4px;">Method: bKash (01700000000)</div>
                </div>
                <div class="btn-group">
                    <button class="btn-act btn-approve" onclick="alert('পেমেন্ট অ্যাপ্রুভ করা হয়েছে!')">Approve & Pay</button>
                    <button class="btn-act btn-delete" onclick="alert('উইথড্র বাতিল করা হয়েছে!')">Reject</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
