<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Article | Wareligent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8f9fa; padding: 20px; }
        .form-card { max-width: 600px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 8px; border: 1px solid #e5e7eb; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0 20px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #f97316; color: #fff; border: none; padding: 12px 20px; font-weight: 600; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Submit New Article</h2>
        <form id="postForm">
            <label>Author Name</label>
            <input type="text" id="author" required placeholder="Your Name">
            
            <label>Title</label>
            <input type="text" id="title" required placeholder="Article Title">
            
            <label>Content</label>
            <textarea id="content" rows="6" required placeholder="Write your article here..."></textarea>
            
            <button type="submit">Publish Article</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const author = document.getElementById('author').value;
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            const { error } = await supabase.from('articles').insert([{ author, title, content }]);

            if (error) {
                alert('Error submitting article: ' + error.message);
            } else {
                alert('Article published successfully!');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
