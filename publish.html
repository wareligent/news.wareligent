<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Article | Wareligent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8f9fa; padding: 20px; }
        .form-card { max-width: 600px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 10px; border: 1px solid #e5e7eb; }
        h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 20px; }
        label { font-size: 0.85rem; font-weight: 600; color: #374151; display: block; margin-top: 15px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #d1d5db; border-radius: 6px; font-family: inherit; font-size: 0.9rem; }
        .hint { font-size: 0.75rem; color: #6b7280; margin-top: 3px; }
        button { background: #f97316; color: #fff; border: none; padding: 12px 20px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 20px; width: 100%; font-size: 0.95rem; }
        button:hover { background: #ea580c; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Submit New Article</h2>
        <form id="postForm">
            <label>Author Name</label>
            <input type="text" id="author" required placeholder="Your Name">
            
            <label>Article Title</label>
            <input type="text" id="title" required placeholder="Article Title">

            <label>Image URL (ImgBB Link)</label>
            <input type="url" id="image_url" placeholder="https://i.ibb.co/example.jpg">
            <div class="hint">Upload image to <a href="https://imgbb.com" target="_blank">imgbb.com</a> and paste the Direct Link here.</div>

            <label>Content</label>
            <textarea id="content" rows="6" required placeholder="Write your article here..."></textarea>
            
            <button type="submit" id="submitBtn">Publish Article</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://xveccsbdrysuiwyuvodw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_HkyRE170ylT0kkdZxbwUSQ_ihHrS_Ra';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Publishing...';
            btn.disabled = true;

            const author = document.getElementById('author').value;
            const title = document.getElementById('title').value;
            const image_url = document.getElementById('image_url').value;
            const content = document.getElementById('content').value;

            const { error } = await supabaseClient.from('articles').insert([{ author, title, image_url, content }]);

            if (error) {
                alert('Error submitting article: ' + error.message);
                btn.innerText = 'Publish Article';
                btn.disabled = false;
            } else {
                alert('Article published successfully!');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
