<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Article | Wareligent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8f9fa; padding: 20px; }
        .form-card { max-width: 650px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 10px; border: 1px solid #e5e7eb; }
        h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 20px; }
        label { font-size: 0.85rem; font-weight: 600; color: #374151; display: block; margin-top: 12px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #d1d5db; border-radius: 6px; font-family: inherit; font-size: 0.9rem; }
        .img-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .hint { font-size: 0.75rem; color: #6b7280; margin-top: 5px; }
        button { background: #f97316; color: #fff; border: none; padding: 12px 20px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 20px; width: 100%; font-size: 0.95rem; }
        button:hover { background: #ea580c; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Submit New Article</h2>
        <form id="postForm">
            <label>Author Name</label>
            <input type="text" id="author" required placeholder="Your Name">
            
            <label>Article Title</label>
            <input type="text" id="title" required placeholder="Article Title">

            <label>Images (Max 7 Images - ImgBB Links)</label>
            <input type="url" id="img1" placeholder="Main Cover Image (Required)" required>
            <div class="img-grid">
                <input type="url" id="img2" placeholder="Image 2 (Optional)">
                <input type="url" id="img3" placeholder="Image 3 (Optional)">
                <input type="url" id="img4" placeholder="Image 4 (Optional)">
                <input type="url" id="img5" placeholder="Image 5 (Optional)">
                <input type="url" id="img6" placeholder="Image 6 (Optional)">
                <input type="url" id="img7" placeholder="Image 7 (Optional)">
            </div>
            <div class="hint">Upload images to <a href="https://imgbb.com" target="_blank">imgbb.com</a> and paste Direct Links.</div>

            <label>Content</label>
            <textarea id="content" rows="6" required placeholder="Write your article here..."></textarea>
            
            <button type="submit" id="submitBtn">Publish Article</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://xveccsbdrysuiwyuvodw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_HkyRE170ylT0kkdZxbwUSQ_ihHrS_Ra';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Publishing...';
            btn.disabled = true;

            // Collect all non-empty image links into a list
            const imagesList = [];
            for (let i = 1; i <= 7; i++) {
                const url = document.getElementById(`img${i}`).value.trim();
                if (url) imagesList.push(url);
            }

            const author = document.getElementById('author').value;
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            // Save images as comma-separated text
            const { error } = await supabaseClient.from('articles').insert([{ 
                author, 
                title, 
                image_url: imagesList.join(','), 
                content 
            }]);

            if (error) {
                alert('Error submitting article: ' + error.message);
                btn.innerText = 'Publish Article';
                btn.disabled = false;
            } else {
                alert('Article published successfully!');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
