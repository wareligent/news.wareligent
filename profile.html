<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | Wareligent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --accent: #f97316;
            --accent-hover: #ea580c;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); padding: 40px 15px; }

        .container { max-width: 750px; margin: 0 auto; }
        
        .header-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
        .user-details h2 { font-size: 1.4rem; font-weight: 700; }
        .user-details p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        
        .btn-action { background: #f1f5f9; border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; color: var(--text-main); text-decoration: none; }
        .btn-danger { background: #fef2f2; border-color: #fca5a5; color: var(--danger); }

        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; color: var(--text-main); }

        .post-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .post-info h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
        .post-info p { font-size: 0.8rem; color: var(--text-muted); }

        .btn-delete { background: var(--danger); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <!-- User Info Card -->
        <div class="header-card">
            <div class="user-details">
                <h2 id="userName">Loading...</h2>
                <p id="userEmail">Loading...</p>
            </div>
            <div style="display:flex; gap:10px;">
                <a href="index.html" class="btn-action">Home</a>
                <button onclick="handleLogout()" class="btn-action btn-danger">Logout</button>
            </div>
        </div>

        <!-- User Articles Management -->
        <h3 class="section-title">Manage Your Articles</h3>
        <div id="userArticlesContainer">Loading your posts...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://xveccsbdrysuiwyuvodw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_HkyRE170ylT0kkdZxbwUSQ_ihHrS_Ra';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;

        async function initProfile() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                alert("Please log in to view your profile.");
                window.location.href = 'login.html';
                return;
            }

            currentUser = session.user;
            const authorName = currentUser.user_metadata.full_name || 'Anonymous User';
            
            document.getElementById('userName').innerText = authorName;
            document.getElementById('userEmail').innerText = currentUser.email;

            loadUserArticles(authorName);
        }

        async function loadUserArticles(authorName) {
            const container = document.getElementById('userArticlesContainer');
            
            const { data: articles, error } = await supabaseClient
                .from('articles')
                .select('*')
                .eq('author', authorName)
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = '<p style="color:red;">Failed to load posts.</p>';
                return;
            }

            if (!articles || articles.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">You haven\'t published any articles yet.</p>';
                return;
            }

            container.innerHTML = articles.map(item => `
                <div class="post-card">
                    <div class="post-info">
                        <h3>${item.title || 'Untitled'}</h3>
                        <p>Published on: ${new Date(item.created_at).toLocaleDateString()}</p>
                    </div>
                    <button class="btn-delete" onclick="deleteArticle('${item.id}')">Delete Post</button>
                </div>
            `).join('');
        }

        async function deleteArticle(id) {
            if (confirm("Are you sure you want to delete this article?")) {
                const { error } = await supabaseClient
                    .from('articles')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert("Delete failed: " + error.message);
                } else {
                    alert("Article deleted successfully.");
                    const authorName = currentUser.user_metadata.full_name || 'Anonymous User';
                    loadUserArticles(authorName);
                }
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        initProfile();
    </script>
</body>
</html>
